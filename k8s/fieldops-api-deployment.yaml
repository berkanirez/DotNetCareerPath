# Day 101: FieldOps.Api in Kubernetes. Its connection strings come from a
# Secret named "fieldops-api-secrets", which is deliberately NOT a file in
# this repo — Secret values are only base64-encoded, not encrypted, so it is
# created from .env with `kubectl create secret generic` instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fieldops-api
spec:
  # One replica on purpose: the API also hosts background workers
  # (OutboxPublisher, the audit consumer, the cache warmer). Running two
  # copies would run two of each — the Inbox makes duplicate consumption
  # safe, but that's a separate topic from today's ConfigMap/Secret.
  replicas: 1
  selector:
    matchLabels:
      app: fieldops-api
  template:
    metadata:
      labels:
        app: fieldops-api
    spec:
      containers:
        - name: fieldops-api
          image: fieldops-api:day101
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fieldops-api-config
            - secretRef:
                name: fieldops-api-secrets
          # Day 56's two endpoints, used for exactly the two questions they
          # were written for: /health/ready checks SQL Server and Redis, so a
          # Pod that can't reach them stops receiving traffic; /health/live
          # checks nothing external, so a dependency outage never triggers a
          # pointless restart loop.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: fieldops-api
spec:
  type: ClusterIP
  selector:
    app: fieldops-api
  ports:
    - port: 80
      targetPort: 8080
