apiVersion: v1
kind: Service
metadata:
  name: fieldops-web
spec:
  # ClusterIP (the default): a stable address reachable only from inside the
  # cluster. Today it's reached from outside via `kubectl port-forward`;
  # real external exposure (Ingress) is a later Week 19 day.
  type: ClusterIP
  selector:
    app: fieldops-web
  ports:
    - port: 80
      targetPort: 80
